name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" || exit 1
          done
          echo "All JS files: syntax OK"
